<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="close-btn" type="button" (click)="close()">x</button>

    @if (currentStep === 'email') {
      <h3>Forgot password</h3>
      <form [formGroup]="emailForm" (ngSubmit)="onSubmitEmail()">
        <input type="email" formControlName="email" placeholder="yourname@gmail.com" />
        <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Sending...' : 'Continue' }}</button>
      </form>
    }

    @if (currentStep === 'otp') {
      <h3>Enter OTP</h3>
      <form [formGroup]="otpForm" (ngSubmit)="onSubmitOtp()">
        <div class="otp-row" (paste)="onOtpPaste($event)">
          @for (digit of otpDigits; track $index) {
            <input
              [id]="'otp-box-' + $index"
              maxlength="1"
              [value]="digit"
              (input)="onOtpInput($event, $index)"
              (keydown)="onOtpKeydown($event, $index)"
            />
          }
        </div>
        <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Verifying...' : 'Verify code' }}</button>
      </form>
    }

    @if (currentStep === 'newPassword') {
      <h3>Set new password</h3>
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmitPassword()">
        <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" placeholder="New password" />
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm password"
        />
        <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Saving...' : 'Save password' }}</button>
      </form>
    }

    @if (currentStep === 'success') {
      <h3>Password changed</h3>
      <button type="button" (click)="close()">Back to login</button>
    }
  </div>
</div>
